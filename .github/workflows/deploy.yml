name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/gifted-wozniak-43cw6m]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If the repo's Pages source is still "Deploy from a branch", GitHub also publishes the raw,
      # unbuilt source on every push (a "pages build and deployment" run). Let that finish first so
      # the built game is published last and wins. With Source = "GitHub Actions" this is a no-op.
      - name: Wait for GitHub's branch deployment, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length' || echo 0)
            if [ "$pending" = "0" ]; then echo "No branch deployment in progress."; break; fi
            echo "Waiting for branch deployment to finish ($pending running)..."
            sleep 10
          done
      - id: deployment
        uses: actions/deploy-pages@v4
